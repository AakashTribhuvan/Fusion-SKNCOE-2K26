<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title description">
  <title id="title">Six numbered QR target boxes</title>
  <desc id="description">Keep your face centered. Move the phone QR around the edge boxes: down the right side from 1 to 3, across the bottom to 4, then up the left side through 5 to 6.</desc>
  <path d="M 315 56 V 94 M 315 136 V 174 M 294 195 H 66 M 45 174 V 136 M 45 94 V 56" fill="none" stroke="#b69d36" stroke-dasharray="5 5" stroke-width="2"/>
  <g fill="#f7f8f4" stroke="#245c48" stroke-width="2">
    <rect x="294" y="14" width="42" height="42"/><rect x="294" y="94" width="42" height="42"/><rect x="294" y="174" width="42" height="42"/>
    <rect x="24" y="174" width="42" height="42"/><rect x="24" y="94" width="42" height="42"/><rect x="24" y="14" width="42" height="42"/>
  </g>
  <g fill="#245c48" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="315" y="43">1</text><text x="315" y="123">2</text><text x="315" y="203">3</text>
    <text x="45" y="203">4</text><text x="45" y="123">5</text><text x="45" y="43">6</text>
  </g>
  <text x="180" y="224" fill="#58665e" font-family="sans-serif" font-size="12" text-anchor="middle">face stays centered · QR follows edge boxes</text>
</svg>
