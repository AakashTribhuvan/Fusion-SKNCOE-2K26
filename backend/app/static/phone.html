<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <title>Fusion · Phone Challenge</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#18365a 0,transparent 48%),#0a0f1c;color:#edf3ff;font:16px/1.5 Inter,system-ui,sans-serif}.card{width:min(100%,440px);padding:24px;border:1px solid #263651;border-radius:22px;background:#111a2c;text-align:center}.mark{margin:auto;display:grid;place-items:center;width:42px;height:42px;border:1px solid #45658e;border-radius:14px;color:#8de3c1;font-weight:800}.muted{color:#99a8c2}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#1a2c42;color:#8de3c1;font-size:12px}.qr{width:min(76vw,300px);height:min(76vw,300px);margin:18px auto;padding:10px;border-radius:16px;background:#fff;object-fit:contain}.phrase{padding:13px;border:1px solid #355a67;border-radius:12px;color:#8de3c1;font-size:21px;font-weight:700}.hidden{display:none!important}#message{min-height:44px;margin-top:12px;color:#99a8c2}.btn{border:0;border-radius:11px;padding:12px 16px;background:#8de3c1;color:#092117;font-weight:700}
  </style>
</head>
<body><main class="card">
  <div class="mark">F</div><h1>Phone challenge</h1>
  <p class="muted">Keep this page open and show the changing code to the laptop camera.</p>
  <div id="waiting"><span class="pill">PAIRING PHONE</span><p class="muted">After pairing, verify locally with your phone's platform authenticator to sign this session.</p></div>
  <section id="challenge" class="hidden"><img id="qr" class="qr" alt="Rotating, one-time verification QR code"><p id="step" class="muted"></p><span class="pill">MOVE IN A SLOW FIGURE EIGHT</span></section>
  <div id="message" role="status" aria-live="polite">Connecting to the session…</div>
</main>
<script>
(() => {
  const sessionId = location.pathname.split('/').filter(Boolean).pop();
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || sessionStorage.getItem(`fusion:${sessionId}`);
  const headers = {'X-Pair-Token': token || ''};
  const $ = id => document.getElementById(id);
  const say = text => $('message').textContent = text;
  const call = async (path, options={}) => {const r=await fetch(path,{...options,headers:{...headers,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const d=r.headers.get('content-type')?.includes('application/json')?await r.json():null;if(!r.ok){const error=new Error(d?.detail||`Request failed (${r.status})`);error.status=r.status;throw error;}return d;};
  const toBuffer = value => {const base64=value.replace(/-/g,'+').replace(/_/g,'/');const binary=atob(base64+'='.repeat((4-base64.length%4)%4));return Uint8Array.from(binary,c=>c.charCodeAt(0)).buffer;};
  const toBase64Url = value => {const bytes=new Uint8Array(value);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
  const deviceId = () => {let id=localStorage.getItem('fusion:phone-device-id');if(!id){id=crypto.randomUUID();localStorage.setItem('fusion:phone-device-id',id);}return id;};
  const serializeCredential = (credential, registering) => {const r=credential.response;const response={clientDataJSON:toBase64Url(r.clientDataJSON)};if(registering){response.attestationObject=toBase64Url(r.attestationObject);response.transports=r.getTransports?.()||[];}else{response.authenticatorData=toBase64Url(r.authenticatorData);response.signature=toBase64Url(r.signature);response.userHandle=r.userHandle?toBase64Url(r.userHandle):null;}return{id:credential.id,rawId:toBase64Url(credential.rawId),type:credential.type,authenticatorAttachment:credential.authenticatorAttachment,response,clientExtensionResults:credential.getClientExtensionResults()};};
  const registerPhone = async id => {say('Create a phone platform credential and complete local user verification…');const options=await call(`/api/sessions/${sessionId}/phone/webauthn/registration/options`,{method:'POST',body:JSON.stringify({device_id:id})});options.challenge=toBuffer(options.challenge);options.user.id=toBuffer(options.user.id);options.excludeCredentials=(options.excludeCredentials||[]).map(item=>({...item,id:toBuffer(item.id)}));const credential=await navigator.credentials.create({publicKey:options});if(!credential)throw new Error('Phone credential creation was cancelled.');await call(`/api/sessions/${sessionId}/phone/webauthn/registration/verify`,{method:'POST',body:JSON.stringify({credential:serializeCredential(credential,true)})});};
  const authenticatePhone = async id => {say('Verify locally with your phone to sign a fresh server challenge…');const options=await call(`/api/sessions/${sessionId}/phone/webauthn/authentication/options`,{method:'POST',body:JSON.stringify({device_id:id})});options.challenge=toBuffer(options.challenge);options.allowCredentials=(options.allowCredentials||[]).map(item=>({...item,id:toBuffer(item.id)}));const assertion=await navigator.credentials.get({publicKey:options});if(!assertion)throw new Error('Phone verification was cancelled.');await call(`/api/sessions/${sessionId}/phone/webauthn/authentication/verify`,{method:'POST',body:JSON.stringify({credential:serializeCredential(assertion,false)})});};
  let activeChallenge = null;
  let ticker = null;
  async function connect() {
    try {
      if (!token) throw new Error('Pairing token is missing. Scan the QR from the laptop again.');
      if (params.has('token')) { await call(`/api/sessions/${sessionId}/pair`,{method:'POST',body:JSON.stringify({token})}); sessionStorage.setItem(`fusion:${sessionId}`,token); history.replaceState({},'',location.pathname); }
      if (!isSecureContext || !navigator.credentials || !navigator.credentials.create || !navigator.credentials.get) throw new Error('Phone platform authentication needs a secure HTTPS page. Use localhost for laptop-only testing or deploy the demo behind HTTPS for your phone.');
      const session=await call(`/api/sessions/${sessionId}`);
      if(!session.phone_verified){let id=localStorage.getItem('fusion:phone-device-id');if(id){try{await authenticatePhone(id);}catch(error){if(error.status!==409)throw error;localStorage.removeItem('fusion:phone-device-id');id=null;}}if(!id){id=deviceId();await registerPhone(id);await authenticatePhone(id);}}
      say('Phone user verification succeeded. Biometric data stayed on this device. Waiting for the laptop to start the challenge…');
      setInterval(async () => {
        try { const challenge=await call(`/api/sessions/${sessionId}/challenge`); if(challenge.status==='active'&&challenge.id!==activeChallenge?.id){activeChallenge=challenge;startSequence(challenge);} }
        catch(error){ if(!error.message.includes('has not started')) say(error.message); }
      },1000);
    } catch(error) { say(error.message); }
  }
  function startSequence(challenge) {
    if(ticker)clearInterval(ticker);
    $('waiting').classList.add('hidden'); $('challenge').classList.remove('hidden'); say('Challenge active.');
    let step=0;
    let priorImageUrl=null;
    const show=async()=>{
      const current=step;
      $('step').textContent=`Signal ${current+1} of ${challenge.step_count} · live sequence`;
      step=(step+1)%challenge.step_count;
      try {
        const response=await fetch(`/api/sessions/${sessionId}/challenge/${challenge.id}/qr/${current}`,{headers});
        if(!response.ok)throw new Error('Challenge expired. Restart from the laptop.');
        const imageUrl=URL.createObjectURL(await response.blob());
        if(priorImageUrl)URL.revokeObjectURL(priorImageUrl);
        priorImageUrl=imageUrl;$('qr').src=imageUrl;$('qr').classList.remove('hidden');
      } catch(error) { say(error.message);clearInterval(ticker); }
    };
    show();ticker=setInterval(show,1500);
  }
  connect();
})();
</script>
</body>
</html>
