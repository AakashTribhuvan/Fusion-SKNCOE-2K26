<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1f3ef">
  <title>Frame / Check · Local QA Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--canvas:#f1f3ef;--ink:#17241f;--muted:#718078;--line:#d7ddd6;--green:#245c48;--amber:#f2e2a5}
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 "DM Sans",Arial,sans-serif}
    .shell{max-width:1500px;margin:auto;padding:0 28px 24px}
    header{display:flex;align-items:center;justify-content:space-between;min-height:64px;border-bottom:1px solid #89948c}
    .brand{font-size:12px;font-weight:700;letter-spacing:.05em}
    .tag{color:var(--muted);font:9px "IBM Plex Mono",Consolas,monospace;text-transform:uppercase}
    .control{display:flex;align-items:center;gap:12px;margin:14px 0;padding:12px 14px;border:1px solid #d7c17b;background:#fff8e5}
    .control p{flex:1;margin:0;color:#594f34;font-size:11px}
    button{min-height:38px;padding:0 13px;border:0;background:var(--green);color:white;font:600 9px "IBM Plex Mono",Consolas,monospace;text-transform:uppercase;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    button.secondary{border:1px solid #89948c;background:transparent;color:var(--ink)}
    #status{min-width:155px;color:#59675f;font-size:10px}
    iframe{display:block;width:100%;height:calc(100vh - 145px);min-height:620px;border:1px solid var(--line);background:var(--canvas)}
    @media(max-width:760px){.shell{padding:0 12px 14px}.control{align-items:stretch;flex-direction:column}.control p{flex:none}#status{min-width:0}}
  </style>
</head>
<body>
  <main class="shell">
    <header><span class="brand">FRAME / CHECK</span><span class="tag">Local QA control · no real evidence</span></header>
    <section class="control" aria-label="Development-only step control">
      <p><strong>Simulation only.</strong> Advance one UI stage at a time without using the phone authenticator, camera, microphone, or screening APIs. This does not create or modify real verification evidence.</p>
      <span id="status" role="status" aria-live="polite">Checking local development access…</span>
      <button id="advance" type="button" disabled>Override current action · next step</button>
      <button id="reset" class="secondary" type="button">Reset simulation</button>
    </section>
    <iframe id="app" title="Frame / Check QA simulation" src="/?qa=1"></iframe>
  </main>
  <script>
    (() => {
      const frame = document.getElementById('app');
      const advance = document.getElementById('advance');
      const status = document.getElementById('status');
      const reset = document.getElementById('reset');
      advance.addEventListener('click', () => {
        advance.disabled = true;
        frame.contentWindow.postMessage({type:'qa-advance'}, location.origin);
      });
      reset.addEventListener('click', () => {
        advance.disabled = true;
        status.textContent = 'Reloading QA simulation…';
        frame.src = '/?qa=1';
      });
      window.addEventListener('message', event => {
        if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
        if (event.data?.type === 'qa-ready') {
          advance.disabled = !event.data.enabled;
          status.textContent = event.data.enabled
            ? 'Development QA enabled · UI-only'
            : 'QA controls disabled by server configuration.';
        }
        if (event.data?.type === 'qa-advance-result') {
          advance.disabled = false;
          status.textContent = event.data.ok
            ? `Simulated next step: ${event.data.stage}.`
            : event.data.detail || 'Could not advance the simulation.';
        }
      });
    })();
  </script>
</body>
</html>
